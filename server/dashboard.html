<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Alarm Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Smart Alarm Clock</h1>
      <div id="serverTime" class="server-time">--</div>
    </header>

    <section class="glass panel monitoring-grid">
      <div class="panel-head">
        <h2>Monitoring</h2>
        <span id="syncState" class="pill">Waiting</span>
      </div>
      <div class="metric-grid">
        <div class="metric"><div class="metric-label">Device</div><div id="deviceId" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Connection</div><div id="connection" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Temperature</div><div id="temperature" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Humidity</div><div id="humidity" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Air Quality</div><div id="airQuality" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">VOC / eCO2</div><div id="airChemistry" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Clock</div><div id="deviceTime" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Alarm</div><div id="alarmState" class="metric-value">--</div></div>
        <div class="metric"><div class="metric-label">Next Alarm</div><div id="nextAlarm" class="metric-value">--</div></div>
      </div>
    </section>

    <section class="glass panel comfort-panel">
      <div>
        <div class="panel-head">
          <h2>Room Comfort</h2>
          <span id="comfortRange" class="pill">18-26 C</span>
        </div>
        <div class="comfort-ranges">
          <label>
            Minimum temperature
            <input id="minTemperature" type="number" min="-20" max="60" step="0.5">
          </label>
          <label>
            Maximum temperature
            <input id="maxTemperature" type="number" min="-20" max="60" step="0.5">
          </label>
        </div>
      </div>
      <div class="comfort-status" aria-label="Room comfort alerts">
        <button id="tooColdAlert" class="status-light" type="button" aria-pressed="false">
          <strong>Too cold</strong>
        </button>
        <button id="tooHotAlert" class="status-light" type="button" aria-pressed="false">
          <strong>Too hot</strong>
        </button>
        <button id="badAirAlert" class="status-light" type="button" aria-pressed="false">
          <strong>Bad air</strong>
        </button>
        <button id="humidityAlert" class="status-light" type="button" aria-pressed="false">
          <strong>Humidity</strong>
        </button>
      </div>
    </section>

    <div class="dashboard-grid">
      <section class="glass panel alarms-panel">
        <div class="panel-head">
          <h2>Alarms</h2>
          <button id="addAlarmButton" type="button" title="Add alarm">+</button>
        </div>
        <form id="settingsForm">
          <div id="alarmList" class="alarm-list"></div>
          <div class="actions">
            <button id="saveButton" class="primary" type="submit">Save</button>
            <span id="message" class="message"></span>
          </div>
        </form>
      </section>

      <section class="glass panel sleep-panel">
        <div class="panel-head">
          <h2>Sleep Schedule</h2>
          <span id="sleepTarget" class="pill">5 cycles</span>
        </div>
        <div class="form-grid">
          <label class="wide">
            Age group
            <select id="ageGroup"></select>
          </label>
          <label>
            Time to fall asleep
            <input id="fallAsleep" type="number" min="0" max="90" step="1">
          </label>
          <label>
            Everyday
            <input id="sleepEveryday" type="checkbox">
          </label>
          <div class="wide segmented">
            <button id="wakeMode" type="button">Wake at</button>
            <button id="bedMode" type="button">Sleep at</button>
          </div>
          <label id="wakeTimeField">
            Wake time
            <input id="wakeTime" type="time">
          </label>
          <label id="bedTimeField">
            Bed time
            <input id="bedTime" type="time">
          </label>
          <button id="sleepNowButton" type="button">Sleep Now</button>
        </div>
        <div>
          <h3>Recommendations</h3>
          <div id="sleepResults" class="result-list"></div>
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
